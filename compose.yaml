services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      LIVE_PUBLISH: ${LIVE_PUBLISH:-0}
      FFPROBE_BIN: ffprobe
    volumes:
      - ./data:/data
      - ./data/.runtime:/app/.runtime
      - ./.env:/app/.env
    ports:
      - "${WEB_PORT:-8000}:8000"
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py collectstatic --noinput && exec waitress-serve --listen=0.0.0.0:8000 config.wsgi:application
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/admin/login/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    env_file: .env
    environment:
      DATA_DIR: /data
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      LIVE_PUBLISH: ${LIVE_PUBLISH:-0}
      FFPROBE_BIN: ffprobe
    volumes:
      - ./data:/data
      - ./data/.runtime:/app/.runtime
      - ./.env:/app/.env
    command: ["python", "manage.py", "run_scheduler", "--publish", "--include-unscheduled", "--process-limit", "10"]
